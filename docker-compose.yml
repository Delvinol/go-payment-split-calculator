
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payment_backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped